<nav class="top-navbar">
  <div class="nav-left">
    <a class="nav-logo">
      Price Monitor
    </a>
    <div class="nav-links">
      @if (sessionService.isLoggedIn()) {
        <a [routerLink]="homeRouterLink"
           class="nav-link"
           routerLinkActive="active-link"
           [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }">
          {{ 'HOME' | translate }}
        </a>
        <a [routerLink]="alertsRouterLink"
           class="nav-link"
           routerLinkActive="active-link"
           [routerLinkActiveOptions]="{ paths: 'exact', queryParams: 'ignored', fragment: 'ignored', matrixParams: 'ignored' }">
          {{ 'MY_ALERTS' | translate }}
        </a>
      }
    </div>
  </div>

  <div class="nav-actions">
    <button class="btn-primary add-product-btn" style="min-width: 10rem" (click)="modalService.openAddProduct()">
      {{ 'ADD_ITEM' | translate }}
    </button>
    <div class="nav-divider"></div>
    <div class="nav-flags">
      <button class="flag-btn" (click)="switchLanguage('en')">
        <a href="https://www.flaticon.com/free-icons/united-states" style="display: none" title="united states icons">United states icons created by Freepik - Flaticon</a>
        <img src="assets/images/usa-flag.png" alt="USA Flag"/>
      </button>
      <button class="flag-btn" (click)="switchLanguage('pl')">
        <a href="https://www.flaticon.com/free-icons/poland" style="display: none" title="poland icons">Poland icons created by Freepik - Flaticon</a>
        <img src="assets/images/poland-flag.png" alt="Poland Flag"/>
      </button>
    </div>
    <div class="nav-divider"></div>

    @if (!sessionService.isLoggedIn()) {
      <div class="nav-auth">
        <button class="btn-secondary" (click)="modalService.openLogin()">
          {{ 'SIGN_IN' | translate }}
        </button>
        <button class="btn-primary" (click)="modalService.openRegister()">
          {{ 'SIGN_UP' | translate }}
        </button>
      </div>
    } @else {
      <div class="nav-user">
        <span class="user-name">{{ sessionService.username() }}</span>
        <app-notification-dropdown></app-notification-dropdown>
        <app-settings-dropdown />

        <button class="icon-btn logout-btn" (click)="sessionService.logout()" [title]="'LOGOUT' | translate">
          <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
            <polyline points="16 17 21 12 16 7"></polyline>
            <line x1="21" y1="12" x2="9" y2="12"></line>
          </svg>
        </button>
      </div>
    }
  </div>
</nav>
