@if (toastService.state().visible) {
  <div class="toast-container"
       [class.success]="toastService.state().type === 'success'"
       [class.error]="toastService.state().type === 'error'">
    @if (toastService.state().type === 'success') {
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <polyline points="20 6 9 17 4 12"></polyline>
      </svg>
    } @else if (toastService.state().type === 'error') {
      <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"></circle>
        <line x1="15" y1="9" x2="9" y2="15"></line>
        <line x1="9" y1="9" x2="15" y2="15"></line>
      </svg>
    }

    <span>
      {{ toastService.state().message }}
      @if (toastService.state().code) {
        <span class="toast-code">[{{ toastService.state().code }}]</span>
      }
    </span>
  </div>
}
