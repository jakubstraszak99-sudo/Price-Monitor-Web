---
openapi: 3.1.0
info:
  title: OpenAPI definition
  version: v0
servers:
  - url: http://localhost:8080
    description: Generated server url
paths:
  "/api/v1/user/password/forgot":
    post:
      tags:
        - User
      summary: Forgot password
      description: Sends a message with a password reset link
      operationId: forgotPassword
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ForgotPasswordRequest"
        required: true
      responses:
        '202':
          description: Request received
  "/api/v1/product/info/preview":
    post:
      tags:
        - Product
      summary: Product scraping
      description: Extracts product info
      operationId: extractProductInfo
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ProductInfoRequest"
        required: true
      responses:
        '200':
          description: Product info successfully extracted
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ScrapedProduct"
        '400':
          description: Invalid scrape request
        '422':
          description: Unable to extract product info from the given source
        '504':
          description: Timed out while scraping the target source
  "/api/v1/auth/register":
    post:
      tags:
        - Authentication
      summary: User registration
      description: Creates a new user account
      operationId: register
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserRegisterRequest"
        required: true
      responses:
        '201':
          description: User registered successfully
        '400':
          description: Invalid input or email already in use
  "/api/v1/auth/refresh":
    post:
      tags:
        - Authentication
      summary: Refresh access token
      description: Generates a new access token
      operationId: refreshToken
      responses:
        '200':
          description: Token refreshed successfully
          headers:
            Set-Cookie:
              description: New accessToken cookie
              style: simple
        '401':
          description: Invalid or expired refresh token
  "/api/v1/auth/logout":
    post:
      tags:
        - Authentication
      summary: Logout user
      description: Invalidates session and clears cookies
      operationId: logout
      responses:
        '204':
          description: Logged out successfully
  "/api/v1/auth/login":
    post:
      tags:
        - Authentication
      summary: Login user
      description: Authenticates user and returns JWT tokens in HttpOnly cookies
      operationId: login
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UserLoginRequest"
        required: true
      responses:
        '200':
          description: Login successful
          headers:
            Set-Cookie:
              description: accessToken and refreshToken cookies
              style: simple
        '401':
          description: Invalid credentials or unverified account
  "/api/v1/alert":
    get:
      tags:
        - Price Alert
      summary: Fetch price alerts
      description: Returns a paginated list of price alerts
      operationId: getAlerts
      parameters:
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
        - name: sort
          in: query
          description: 'Sorting criteria in the format: property,(asc|desc). Default
          sort order is ascending. Multiple sort criteria are supported.'
          required: false
          schema:
            type: array
            default:
              - createdAt,ASC
            items:
              type: string
        - name: search
          in: query
          description: Filter price alerts by product name (case-insensitive, partial
            match)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Page of products retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PriceAlertPage"
    post:
      tags:
        - Price Alert
      summary: Create price alert
      description: Creates a new price alert
      operationId: createAlert
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/CreatePriceAlertRequest"
        required: true
      responses:
        '201':
          description: Price alert created successfully
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '409':
          description: Price alert already exists
  "/api/v1/user/settings":
    patch:
      tags:
        - User
      summary: Update user settings
      description: Enables or disables price alert emails for the authenticated user
      operationId: updateSettings
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdateUserSettingsRequest"
        required: true
      responses:
        '200':
          description: Settings updated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '400':
          description: Invalid settings
        '401':
          description: Unauthorized
  "/api/v1/user/password":
    patch:
      tags:
        - User
      summary: Password change
      description: Changes user password
      operationId: updatePassword
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdatePasswordRequest"
        required: true
      responses:
        '200':
          description: Password successfully updated
        '400':
          description: Old password does not match
        '401':
          description: Unauthorized
  "/api/v1/user/password/reset":
    patch:
      tags:
        - User
      summary: Password reset
      description: Resets forgotten password
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/ResetPasswordRequest"
        required: true
      responses:
        '200':
          description: Password has been reset
  "/api/v1/notification/read":
    patch:
      tags:
        - Notification
      summary: Mark notification as read
      description: Marks notification belonging to the current user as read
      operationId: markAsRead
      parameters:
        - name: publicId
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
            format: uuid
      responses:
        '204':
          description: Notification marked as read
  "/api/v1/alert/{publicId}":
    patch:
      tags:
        - Price Alert
      summary: Update price alert
      description: Partially updates price alert (target price and/or active status)
      operationId: updatePriceAlert
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        content:
          application/json:
            schema:
              "$ref": "#/components/schemas/UpdatePriceAlertRequest"
        required: true
      responses:
        '200':
          description: Price alert updated successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PriceAlert"
        '404':
          description: Price alert not found
  "/api/v1/user":
    get:
      tags:
        - User
      summary: Get user
      description: Fetches user data
      operationId: getUser
      responses:
        '200':
          description: User data retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/User"
        '401':
          description: Unauthorized
  "/api/v1/product":
    get:
      tags:
        - Product
      summary: Fetch products
      description: Returns a paginated list of products
      operationId: getProducts
      parameters:
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 24
            minimum: 1
        - name: sort
          in: query
          description: 'Sorting criteria in the format: property,(asc|desc). Default
          sort order is ascending. Multiple sort criteria are supported.'
          required: false
          schema:
            type: array
            default:
              - name,ASC
            items:
              type: string
        - name: search
          in: query
          description: Filter products by name (case-insensitive, partial match)
          required: false
          schema:
            type: string
      responses:
        '200':
          description: Page of products retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/ProductPage"
  "/api/v1/notification":
    get:
      tags:
        - Notification
      summary: Fetch notifications
      description: Returns a paginated list of the current user's notifications
      operationId: getNotifications
      parameters:
        - name: page
          in: query
          description: Zero-based page index (0..N)
          required: false
          schema:
            type: integer
            default: 0
            minimum: 0
        - name: size
          in: query
          description: The size of the page to be returned
          required: false
          schema:
            type: integer
            default: 20
            minimum: 1
        - name: sort
          in: query
          description: 'Sorting criteria in the format: property,(asc|desc). Default
          sort order is ascending. Multiple sort criteria are supported.'
          required: false
          schema:
            type: array
            default:
              - createdAt,ASC
            items:
              type: string
      responses:
        '200':
          description: Page of notifications retrieved successfully
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/NotificationPage"
  "/api/v1/notification/unread/count":
    get:
      tags:
        - Notification
      summary: Get unread notification count
      description: Returns how many of the current user's notifications are unread
      operationId: getUnreadCount
      responses:
        '200':
          description: Unread count retrieved successfully
          content:
            application/json:
              schema:
                type: integer
                format: int64
  "/api/v1/history":
    get:
      tags:
        - Price History
      summary: Get price history
      description: Fetches whole price history of product
      operationId: getPriceHistory
      parameters:
        - name: productUrl
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Price history retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/PriceHistory"
        '400':
          description: Invalid product url
  "/api/v1/auth/verify":
    get:
      tags:
        - Authentication
      summary: User verification
      description: Verifies the user account using the JWT token sent via email
      operationId: verify
      parameters:
        - name: token
          in: query
          description: JWT verification token
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Account verified successfully
        '400':
          description: Invalid or expired token
  "/api/v1/alert/exists":
    get:
      tags:
        - Price Alert
      summary: Check if alert exists
      description: Checks if the user already has an alert for the given product URL
      operationId: checkAlertExists
      parameters:
        - name: productUrl
          in: query
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Successfully checked if alert exists
          content:
            application/json:
              schema:
                type: boolean
        '400':
          description: Invalid product url
  "/api/v1/notification/delete":
    delete:
      tags:
        - Notification
      summary: Delete notification
      description: Removes notification belonging to the current user
      operationId: deleteNotification
      parameters:
        - name: publicId
          in: query
          required: false
          schema:
            type:
              - string
              - 'null'
            format: uuid
      responses:
        '204':
          description: Notification removed successfully
  "/api/v1/alert/{publicId}/delete":
    delete:
      tags:
        - Price Alert
      summary: Delete price alert
      description: Deletes price alert permanently
      operationId: deletePriceAlert
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Price alert deleted successfully
components:
  schemas:
    ForgotPasswordRequest:
      type: object
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
        - email
    ProductInfoRequest:
      type: object
      properties:
        url:
          type: string
          minLength: 1
      required:
        - url
    ScrapedProduct:
      type: object
      properties:
        name:
          type: string
        price:
          type: number
        imageUrl:
          type: string
          format: uri
        currency:
          type: object
          properties:
            currencyCode:
              type: string
            displayName:
              type: string
            symbol:
              type: string
            defaultFractionDigits:
              type: integer
              format: int32
            numericCode:
              type: integer
              format: int32
            numericCodeAsString:
              type: string
        shop:
          type: string
        faviconUrl:
          type: string
          format: uri
    UserRegisterRequest:
      type: object
      properties:
        username:
          type: string
          minLength: 1
        email:
          type: string
          format: email
          minLength: 1
        password:
          type: string
          maxLength: 2147483647
          minLength: 8
      required:
        - email
        - password
        - username
    UserLoginRequest:
      type: object
      properties:
        login:
          type: string
          minLength: 1
        password:
          type: string
          minLength: 1
      required:
        - login
        - password
    CreatePriceAlertRequest:
      type: object
      properties:
        url:
          type: string
          minLength: 1
        targetPrice:
          type: number
          minimum: 0
        scrapedProduct:
          "$ref": "#/components/schemas/ScrapedProduct"
      required:
        - scrapedProduct
        - targetPrice
        - url
    UpdateUserSettingsRequest:
      type: object
      properties:
        emailAlertsEnabled:
          type: boolean
      required:
        - emailAlertsEnabled
    User:
      type: object
      properties:
        publicId:
          type: string
          format: uuid
        username:
          type: string
        email:
          type: string
        emailAlertsEnabled:
          type: boolean
    UpdatePasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 2147483647
          minLength: 8
      required:
        - newPassword
        - oldPassword
    ResetPasswordRequest:
      type: object
      properties:
        resetToken:
          type: string
          minLength: 1
        newPassword:
          type: string
          maxLength: 2147483647
          minLength: 8
      required:
        - newPassword
        - resetToken
    UpdatePriceAlertRequest:
      type: object
      properties:
        active:
          type: boolean
        targetPrice:
          type: number
          minimum: 0
    PriceAlert:
      type: object
      properties:
        publicId:
          type: string
          format: uuid
        targetPrice:
          type: number
        active:
          type: boolean
        product:
          "$ref": "#/components/schemas/Product"
        createdAt:
          type: string
          format: date-time
    Product:
      type: object
      properties:
        name:
          type: string
        productUrl:
          type: string
          format: uri
        imageUrl:
          type: string
          format: uri
        currency:
          type: object
          properties:
            currencyCode:
              type: string
            displayName:
              type: string
            symbol:
              type: string
            defaultFractionDigits:
              type: integer
              format: int32
            numericCode:
              type: integer
              format: int32
            numericCodeAsString:
              type: string
        currentPrice:
          type: number
        lastUpdated:
          type: string
          format: date-time
        shop:
          type: string
        faviconUrl:
          type: string
          format: uri
        available:
          type: boolean
    PageableObject:
      type: object
      properties:
        offset:
          type: integer
          format: int64
        paged:
          type: boolean
        pageNumber:
          type: integer
          format: int32
        pageSize:
          type: integer
          format: int32
        sort:
          "$ref": "#/components/schemas/SortObject"
        unpaged:
          type: boolean
    ProductPage:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/Product"
        pageable:
          "$ref": "#/components/schemas/PageableObject"
        last:
          type: boolean
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        sort:
          "$ref": "#/components/schemas/SortObject"
        first:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
    SortObject:
      type: object
      properties:
        empty:
          type: boolean
        sorted:
          type: boolean
        unsorted:
          type: boolean
    Notification:
      type: object
      properties:
        publicId:
          type: string
          format: uuid
        type:
          type: string
          enum:
            - PRICE_DROP
            - PRODUCT_UNAVAILABLE
        product:
          "$ref": "#/components/schemas/Product"
        productName:
          type: string
        read:
          type: boolean
        triggerPrice:
          type: number
        createdAt:
          type: string
          format: date-time
    NotificationPage:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/Notification"
        pageable:
          "$ref": "#/components/schemas/PageableObject"
        last:
          type: boolean
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        sort:
          "$ref": "#/components/schemas/SortObject"
        first:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
    PriceHistory:
      type: object
      properties:
        recordedPrice:
          type: number
        createdAt:
          type: string
          format: date-time
    PriceAlertPage:
      type: object
      properties:
        content:
          type: array
          items:
            "$ref": "#/components/schemas/PriceAlert"
        pageable:
          "$ref": "#/components/schemas/PageableObject"
        last:
          type: boolean
        totalElements:
          type: integer
          format: int64
        totalPages:
          type: integer
          format: int32
        size:
          type: integer
          format: int32
        number:
          type: integer
          format: int32
        sort:
          "$ref": "#/components/schemas/SortObject"
        first:
          type: boolean
        numberOfElements:
          type: integer
          format: int32
        empty:
          type: boolean
